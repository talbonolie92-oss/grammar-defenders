name: Validate Grammar Defenders

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript modules
        run: |
          find src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
          node scripts/test-session-capacity.mjs
      - name: Detect undefined runtime variables
        run: npx --yes eslint@8.57.1 src --no-eslintrc --env browser,es2022 --global Phaser --global QRCode --parser-options '{"sourceType":"module","ecmaVersion":"latest"}' --rule 'no-undef:error'
      - name: Validate question bank data
        run: node scripts/validate-data.mjs
      - name: Test DOCX question parser
        run: node scripts/test-docx-parser.mjs
      - name: Test question-bank workflow
        run: node scripts/test-question-bank-workflow.mjs
      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save --no-package-lock phaser@3.80.1 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real mobile battlefield rendering
        run: node scripts/test-battlefield-render.mjs
      - name: Validate core game structure and mobile layout
        run: node scripts/validate-game.mjs
