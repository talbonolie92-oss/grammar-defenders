name: Validate Emerald Frontier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gameplay-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run gameplay regression checks
        run: node scripts/validate-game.mjs
